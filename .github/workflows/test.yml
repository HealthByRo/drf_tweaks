name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["Django>=4.2,<4.3", "Django>=5.2,<5.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: pip install "${{ matrix.django-version }}" -r requirements/requirements-base.txt -r requirements/requirements-testing.txt
      - run: ./runtests.py --fast --coverage -rw

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements/requirements-codestyle.txt
      - run: ruff check drf_tweaks tests
